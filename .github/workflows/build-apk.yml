name: Build Cycle Buddy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cycle-buddy-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wawa-cycle-debug-keystore-v1

      - name: Create debug keystore on cache miss
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -storetype JKS -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install JavaScript dependencies
        run: npm install

      - name: Bundle local notifications bridge
        run: npx esbuild www/local-notifications-entry.js --bundle --format=iife --target=es2020 --outfile=www/local-notifications.bundle.js

      - name: Create Android project and sync app
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffe7ed'
          npx cap sync android

      - name: Apply stable signing key and increasing app version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" android/app/debug.keystore
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          run_number = os.environ["GITHUB_RUN_NUMBER"]

          text, version_count = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              lambda match: f"{match.group(1)}versionCode {run_number}",
              text,
              count=1,
          )
          if version_count != 1:
              raise SystemExit("Could not set Android versionCode")

          signing = """    signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """
          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {\n" + signing, 1)

          debug_build_type = """    buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
          """
          if "signingConfig signingConfigs.debug" not in text:
              text = text.replace("    buildTypes {", debug_build_type, 1)

          path.write_text(text)
          print(f"Configured versionCode={run_number} and persistent debug keystore")
          PY

      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wawa-cycle-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cycle-buddy-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload cycle-buddy-latest android/app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create cycle-buddy-latest android/app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --title "Wawa Cycle Tracker — latest APK" --notes "Debug APK for testing the current cycle tracker build."
          fi

